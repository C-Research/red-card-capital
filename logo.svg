<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Red Card Capital mark">
  <defs>
    <linearGradient id="rcCard" x1="0" y1="0" x2="0.34" y2="0.94">
      <stop offset="0" stop-color="#f75151"></stop>
      <stop offset="1" stop-color="#af1418"></stop>
    </linearGradient>
    <radialGradient id="rcMidnight" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#1b3c62"></stop>
      <stop offset="1" stop-color="#0b1f36"></stop>
    </radialGradient>
    <clipPath id="rcClip"><circle cx="200" cy="200" r="200"></circle></clipPath>
