  <g clip-path="url(#rcClip)">
    <circle cx="200" cy="200" r="200" fill="url(#rcMidnight)"></circle>
    <image href="Core Capabilities-Tricolor Blank.png" x="-56" y="-56" width="512" height="512" opacity="0.9" preserveAspectRatio="xMidYMid meet"></image>
  </g>
  <rect x="151" y="130" width="98" height="140" rx="9" fill="url(#rcCard)" transform="rotate(-12 200 200)"></rect>
